name: Build and Publish Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Version Information ==="
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          
          JAVA_VER=$(java -version 2>&1 | head -n 1 | awk -F '"' '{print $2}')
          if [ -z "$JAVA_VER" ]; then
            echo "::error::Could not detect active Java version."
            exit 1
          fi
          
          MAJOR_VER=$(echo "$JAVA_VER" | awk -F '.' '{print ($1 == "1" ? $2 : $1)}')
          echo "Detected Java Major Version: $MAJOR_VER"
          
          if [ -z "$MAJOR_VER" ] || [ "$MAJOR_VER" -lt 17 ]; then
            echo "::error::Java 17 or newer is required. Found version: $JAVA_VER (Major: $MAJOR_VER)"
            exit 1
          fi
          echo "Java environment verified successfully."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create temporary release keystore
        run: |
          if [ -f "./release.keystore" ]; then
            echo "release.keystore already exists."
          else
            echo "Generating temporary release keystore for build..."
            keytool -genkeypair \
              -v \
              -keystore ./release.keystore \
              -alias androidreleasekey \
              -keypass android \
              -storepass android \
              -dname "CN=Android Release,O=Production,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi
          
          if [ ! -f "./release.keystore" ]; then
            echo "::error::Failed to create ./release.keystore."
            exit 1
          fi
          echo "Temporary release keystore verified."

      - name: Build release APK
        run: gradle :app:assembleRelease --stacktrace --no-daemon

      - name: Verify release APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "::error::Expected release APK not found at $EXPECTED_APK"
            echo "Searching within app/build/outputs/apk:"
            find app/build/outputs/apk -type f -name "*.apk" || true
            exit 1
          fi
          
          if [ ! -s "$EXPECTED_APK" ]; then
            echo "::error::Generated APK file is empty: $EXPECTED_APK"
            exit 1
          fi
          
          case "$EXPECTED_APK" in
            *.apk) ;;
            *) echo "::error::File does not have .apk extension: $EXPECTED_APK"; exit 1 ;;
          esac
          
          APK_SIZE=$(stat -c%s "$EXPECTED_APK" 2>/dev/null || wc -c < "$EXPECTED_APK")
          echo "Verified production release APK at $EXPECTED_APK ($APK_SIZE bytes)"

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          REPO_RAW="${{ github.repository }}"
          REPO_NAME=$(echo "$REPO_RAW" | awk -F'/' '{print $2}' | tr -cd '[:alnum:]-_')
          if [ -z "$REPO_NAME" ]; then
            REPO_NAME="smart-calculator"
          fi
          
          ASSET_NAME="${REPO_NAME}-release-build-${{ github.run_number }}.apk"
          TEMP_ASSET_DIR="${RUNNER_TEMP}/release-asset"
          mkdir -p "$TEMP_ASSET_DIR"
          
          cp "app/build/outputs/apk/release/app-release.apk" "$TEMP_ASSET_DIR/$ASSET_NAME"
          
          if [ ! -f "$TEMP_ASSET_DIR/$ASSET_NAME" ] || [ ! -s "$TEMP_ASSET_DIR/$ASSET_NAME" ]; then
            echo "::error::Failed to prepare release asset."
            exit 1
          fi
          
          echo "asset_path=$TEMP_ASSET_DIR/$ASSET_NAME" >> "$GITHUB_OUTPUT"
          echo "asset_name=$ASSET_NAME" >> "$GITHUB_OUTPUT"
          echo "Release asset prepared: $TEMP_ASSET_DIR/$ASSET_NAME"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          
          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "::error::Release asset file is missing or empty: $ASSET_PATH"
            exit 1
          fi
          
          TAG="release-${{ github.run_number }}-${{ github.run_attempt }}"
          TITLE="Release APK #${{ github.run_number }}"
          
          NOTES=$(cat <<EOF
### ⚡ Optimized Production Release APK

This is an automatically generated, R8-optimized production release APK built by GitHub Actions.

- **Build Run Number:** ${{ github.run_number }}
- **Build Attempt:** ${{ github.run_attempt }}
- **Source Commit:** \`${{ github.sha }}\`
- **Release Asset:** \`${ASSET_NAME}\`

#### 🚀 Optimization Highlights:
- **R8 Code Shrinking & Obfuscation**: Enabled
- **Resource Shrinking & Stripping**: Enabled
- **Target OS Compatibility**: Android 8.0+ (API 24 to 36)
- **Engine Performance**: Optimized for low-end devices and instant startup
EOF
)

          echo "Creating GitHub Release with tag: $TAG"
          gh release create "$TAG" "$ASSET_PATH" \
            --target "${{ github.sha }}" \
            --title "$TITLE" \
            --notes "$NOTES" \
            --latest
          
          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "release_title=$TITLE" >> "$GITHUB_OUTPUT"

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_OUTCOME="${{ steps.publish_release.outcome }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          TAG="release-${{ github.run_number }}-${{ github.run_attempt }}"
          TITLE="Release APK #${{ github.run_number }}"
          
          if [ "$RELEASE_OUTCOME" = "success" ]; then
            echo "=== GitHub Release Published Successfully ==="
            gh release view "$TAG" || true
            
            RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${TAG}"
            echo "Release Tag: $TAG"
            echo "Release Title: $TITLE"
            echo "Release URL: $RELEASE_URL"
            echo "APK Asset Name: $ASSET_NAME"
            
            {
              echo "## 🚀 Production Release APK Published Successfully"
              echo ""
              echo "Your optimized release APK has been built and published to GitHub Releases!"
              echo ""
              echo "- **Release:** [$TITLE]($RELEASE_URL)"
              echo "- **Tag:** \`$TAG\`"
              echo "- **Direct Download:** [$ASSET_NAME]($RELEASE_URL)"
              echo ""
              echo "You can download the optimized APK directly from the release **Assets** section."
              echo ""
              echo "> 📦 **Backup:** The GitHub Actions artifact \`release-apk\` is also available on this workflow run."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing was skipped or encountered an issue. The release APK artifact is still available."
            echo "The build step succeeded and the Actions artifact 'release-apk' was preserved."
            
            {
              echo "## ⚠️ Release APK Build Succeeded (Release Publishing Skipped/Failed)"
              echo ""
              echo "The optimized release APK was built successfully and uploaded as a GitHub Actions artifact."
              echo ""
              echo "- **Artifact Name:** \`release-apk\`"
              echo "- You can download the APK directly from the **Artifacts** section of this workflow run."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
