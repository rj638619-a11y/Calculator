name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Version Information ==="
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          
          JAVA_VER=$(java -version 2>&1 | head -n 1 | awk -F '"' '{print $2}')
          if [ -z "$JAVA_VER" ]; then
            echo "::error::Could not detect active Java version."
            exit 1
          fi
          
          MAJOR_VER=$(echo "$JAVA_VER" | awk -F '.' '{print ($1 == "1" ? $2 : $1)}')
          echo "Detected Java Major Version: $MAJOR_VER"
          
          if [ -z "$MAJOR_VER" ] || [ "$MAJOR_VER" -lt 17 ]; then
            echo "::error::Java 17 or newer is required. Found version: $JAVA_VER (Major: $MAJOR_VER)"
            exit 1
          fi
          echo "Java environment verified successfully."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists."
          else
            echo "Generating temporary debug keystore for build..."
            keytool -genkeypair \
              -v \
              -keystore ./debug.keystore \
              -alias androiddebugkey \
              -keypass android \
              -storepass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi
          
          if [ ! -f "./debug.keystore" ]; then
            echo "::error::Failed to create ./debug.keystore."
            exit 1
          fi
          echo "Temporary debug keystore verified."

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "::error::Expected debug APK not found at $EXPECTED_APK"
            echo "Searching within app/build/outputs/apk:"
            find app/build/outputs/apk -type f -name "*.apk" || true
            exit 1
          fi
          
          if [ ! -s "$EXPECTED_APK" ]; then
            echo "::error::Generated APK file is empty: $EXPECTED_APK"
            exit 1
          fi
          
          case "$EXPECTED_APK" in
            *.apk) ;;
            *) echo "::error::File does not have .apk extension: $EXPECTED_APK"; exit 1 ;;
          esac
          
          APK_SIZE=$(stat -c%s "$EXPECTED_APK" 2>/dev/null || wc -c < "$EXPECTED_APK")
          echo "Verified debug APK at $EXPECTED_APK ($APK_SIZE bytes)"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          REPO_RAW="${{ github.repository }}"
          REPO_NAME=$(echo "$REPO_RAW" | awk -F'/' '{print $2}' | tr -cd '[:alnum:]-_')
          if [ -z "$REPO_NAME" ]; then
            REPO_NAME="android-app"
          fi
          
          ASSET_NAME="${REPO_NAME}-debug-build-${{ github.run_number }}.apk"
          TEMP_ASSET_DIR="${RUNNER_TEMP}/release-asset"
          mkdir -p "$TEMP_ASSET_DIR"
          
          cp "app/build/outputs/apk/debug/app-debug.apk" "$TEMP_ASSET_DIR/$ASSET_NAME"
          
          if [ ! -f "$TEMP_ASSET_DIR/$ASSET_NAME" ] || [ ! -s "$TEMP_ASSET_DIR/$ASSET_NAME" ]; then
            echo "::error::Failed to prepare release asset."
            exit 1
          fi
          
          echo "asset_path=$TEMP_ASSET_DIR/$ASSET_NAME" >> "$GITHUB_OUTPUT"
          echo "asset_name=$ASSET_NAME" >> "$GITHUB_OUTPUT"
          echo "Release asset prepared: $TEMP_ASSET_DIR/$ASSET_NAME"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          
          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "::error::Release asset file is missing or empty: $ASSET_PATH"
            exit 1
          fi
          
          TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          TITLE="Debug APK Build #${{ github.run_number }}"
          
          NOTES_FILE="${RUNNER_TEMP}/release_notes.md"
          {
            echo "### 🤖 Android Debug Build"
            echo ""
            echo "This is an automatically generated debug APK built by GitHub Actions."
            echo ""
            echo "- **Workflow Run:** #${{ github.run_number }}"
            echo "- **Attempt:** #${{ github.run_attempt }}"
            echo "- **Commit SHA:** \`${{ github.sha }}\`"
            echo "- **Asset Filename:** \`${ASSET_NAME}\`"
            echo ""
            echo "> ℹ️ **Notice:**"
            echo "> - This APK is intended for testing and development purposes."
            echo "> - This is not a Google Play Store production release."
            echo "> - The APK is signed only with a temporary debug keystore."
          } > "$NOTES_FILE"
          
          echo "Creating GitHub Release with tag: $TAG"
          gh release create "$TAG" "$ASSET_PATH" \
            --target "${{ github.sha }}" \
            --title "$TITLE" \
            --notes-file "$NOTES_FILE" \
            --latest
          
          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "release_title=$TITLE" >> "$GITHUB_OUTPUT"

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_OUTCOME="${{ steps.publish_release.outcome }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          TITLE="Debug APK Build #${{ github.run_number }}"
          
          if [ "$RELEASE_OUTCOME" = "success" ]; then
            echo "=== GitHub Release Published Successfully ==="
            gh release view "$TAG" || true
            
            RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${TAG}"
            echo "Release Tag: $TAG"
            echo "Release Title: $TITLE"
            echo "Release URL: $RELEASE_URL"
            echo "APK Asset Name: $ASSET_NAME"
            
            {
              echo "## 🚀 Debug APK Released Successfully"
              echo ""
              echo "Your debug APK has been built and published to GitHub Releases!"
              echo ""
              echo "- **Release:** [$TITLE]($RELEASE_URL)"
              echo "- **Tag:** \`$TAG\`"
              echo "- **Download APK:** [$ASSET_NAME]($RELEASE_URL)"
              echo ""
              echo "You can download the APK file directly on your phone or device from the release **Assets** section."
              echo ""
              echo "> 📦 **Backup:** The GitHub Actions artifact \`app-debug-apk\` is also available on this workflow run."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing was skipped or encountered an issue. The debug APK artifact remains available."
            echo "The build step succeeded and the Actions artifact 'app-debug-apk' was preserved."
            
            {
              echo "## ℹ️ Debug APK Build Succeeded (Release Publishing Skipped/Failed)"
              echo ""
              echo "The debug APK was built successfully and uploaded as a GitHub Actions artifact."
              echo ""
              echo "- **Artifact Name:** \`app-debug-apk\`"
              echo "- You can download the APK directly from the **Artifacts** section of this workflow run."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
